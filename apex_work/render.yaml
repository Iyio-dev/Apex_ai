services:
  - type: web
    name: apex-api-anjola
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIME_ZONE
        value: Africa/Lagos
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CONTENT_EDITOR_EMAILS
        sync: false
