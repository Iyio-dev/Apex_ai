name: APEX security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-secrets.mjs
      - run: npm test
      - run: node --test integration/student.mjs
      - run: npm audit --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
